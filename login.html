<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGRO-PICK | Login</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="landing-nav">
    <a class="brand" href="index.html">🌱 AGRO-PICK</a>
    <nav><a href="index.html">Home</a><a href="register.html">Register</a></nav>
  </header>
  <main class="auth-container">
    <section class="auth-box">
      <h1>🌱 AGRO-PICK</h1><h2>Welcome Back!</h2><p>Login to access your dashboard.</p>
      <form id="loginForm">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" placeholder="Enter your email" autocomplete="email" required>
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="submit" class="btn">Login</button>
      </form>
      <p id="loginMessage" class="message" role="alert"></p>
      <p>Don't have an account? <a href="register.html">Register here</a></p>
      <a href="index.html">← Back to Home</a>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
